name: Publish F7R Race Control
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dotd.html'
      - 'commentary.html'
      - 'assets/commentary/**'
      - 'manifest.webmanifest'
      - 'assets/f7r-home-*.png'
      - 'history.html'
      - 'race-data.html'
      - 'league.html'
      - 'grid.html'
      - 'tournament.html'
      - 'dashboard/**'
      - 'tests/*.test.mjs'
      - 'package.json'
      - 'admin.html'
      - 'discord.html'
      - 'stewards.html'
      - 'pace.html'
      - 'seats.html'
      - 'admin.css'
      - 'admin.js'
      - 'config.json'
      - 'assets/teams/**'
      - 'assets/liveries/**'
      - 'assets/tyres/**'
      - 'assets/circuits/**'
      - 'assets/f7r-logo.png'
      - 'assets/f7r-favicon.png'
      - 'assets/f7r-app.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check dashboard and flag desk
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare portal
        run: |
          mkdir -p public/assets
          cp -R dashboard public/dashboard
          rm -f public/dashboard/dotd.js public/dashboard/dotd.css
          cp -R assets/teams public/assets/teams
          cp -R assets/liveries public/assets/liveries
          cp -R assets/tyres public/assets/tyres
          cp -R assets/circuits public/assets/circuits
          cp -R assets/commentary public/assets/commentary
          cp commentary.html index.html dotd.html history.html race-data.html league.html grid.html tournament.html admin.html discord.html stewards.html pace.html seats.html admin.css admin.js config.json manifest.webmanifest public/
          cp assets/f7r-logo.png assets/f7r-favicon.png assets/f7r-app.ico assets/f7r-home-*.png public/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the uploaded website to become available
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              const matches = data.artifacts.filter(a => a.name === process.env.ARTIFACT_NAME && !a.expired);
              if (matches.length === 1) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The uploaded website is not available yet. Retry publishing.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
