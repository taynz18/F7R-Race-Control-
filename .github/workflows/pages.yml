name: Publish admin portal
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'config.json'
      - 'assets/f7r-logo.png'
      - 'assets/f7r-app.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare portal
        run: |
          mkdir -p public/assets
          cp index.html admin.html admin.css admin.js config.json public/
          cp assets/f7r-logo.png assets/f7r-app.ico public/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
