name: Publish F7R Race Control
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'history.html'
      - 'grid.html'
      - 'tournament.html'
      - 'dashboard/**'
      - 'tests/*.test.mjs'
      - 'package.json'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'config.json'
      - 'assets/teams/**'
      - 'assets/tyres/**'
      - 'assets/circuits/**'
      - 'assets/f7r-logo.png'
      - 'assets/f7r-app.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check dashboard and flag desk
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare portal
        run: |
          mkdir -p public/assets
          cp -R dashboard public/dashboard
          cp -R assets/teams public/assets/teams
          cp -R assets/tyres public/assets/tyres
          cp -R assets/circuits public/assets/circuits
          cp index.html history.html grid.html tournament.html admin.html admin.css admin.js config.json public/
          cp assets/f7r-logo.png assets/f7r-app.ico public/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

