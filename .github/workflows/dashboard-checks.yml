name: Check combined dashboard and flags
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check dashboard/app.js
      - run: node --check dashboard/flags.js
      - run: node --check receiver/start.mjs

